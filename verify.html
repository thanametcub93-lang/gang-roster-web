<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบยืนยันตัวตน Google Account • SPONGEBOB 577</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/gang_logo.png">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #151822 0%, #0a0b0f 65%, #000000 100%);
      color: #ffffff;
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .verify-card {
      background: rgba(18, 20, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 50px rgba(66, 133, 244, 0.15);
      padding: 38px 32px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(16px);
      animation: cardPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardPop {
      from { opacity: 0; transform: scale(0.93) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .verify-header-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .verify-logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(225, 29, 72, 0.3);
    }

    .verify-logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
    }

    .google-badge-icon {
      width: 40px;
      height: 40px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .google-badge-icon img {
      width: 24px;
      height: 24px;
    }

    .verify-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 4px;
      color: #fff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .verify-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    /* Google Sign-In / Account Form */
    .account-form {
      width: 100%;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #94a3b8;
      pointer-events: none;
    }

    .input-icon img {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(10, 12, 16, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      color: #ffffff;
      font-family: 'Kanit', sans-serif;
      font-size: 13.5px;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #4285F4;
      background: rgba(15, 18, 26, 0.95);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.25);
    }

    .form-input::placeholder {
      color: #64748b;
      font-size: 12.5px;
    }

    /* Google Style Verification Box */
    .recaptcha-box {
      width: 100%;
      height: 60px;
      background: #1c1d22;
      border: 1px solid #333642;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .recaptcha-box:hover {
      border-color: #4285F4;
      background: #22252e;
    }

    .recaptcha-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .recaptcha-checkbox {
      width: 24px;
      height: 24px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .recaptcha-checkbox.verified {
      background: #ffffff;
      border-color: #0f9d58;
    }

    .recaptcha-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid #1a73e8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: captchaSpin 0.75s linear infinite;
    }

    @keyframes captchaSpin {
      to { transform: rotate(360deg); }
    }

    .recaptcha-checkmark {
      display: none;
      color: #0f9d58;
      font-size: 16px;
      font-weight: 900;
    }

    .recaptcha-label {
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      cursor: pointer;
    }

    .google-submit-btn {
      margin-top: 8px;
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #1a73e8, #1557b0);
      color: #ffffff;
      font-family: 'Kanit', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      border: 1px solid #4285F4;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
      transition: all 0.2s ease;
    }

    .google-submit-btn:hover {
      background: linear-gradient(135deg, #1557b0, #0d47a1);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(66, 133, 244, 0.6);
    }

    .google-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .verify-status {
      margin-top: 14px;
      font-size: 12.5px;
      color: #94a3b8;
      min-height: 20px;
      transition: color 0.2s;
    }

    .footer-note {
      margin-top: 22px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="verify-card">
    <div class="verify-header-logos">
      <div class="verify-logo-wrap">
        <img src="/gang_logo.png" alt="SPONGEBOB 577" class="verify-logo-img">
      </div>
      <i class="fa-solid fa-link" style="color: #64748b; font-size: 14px;"></i>
      <div class="google-badge-icon" title="Google Account Security">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
      </div>
    </div>

    <h1 class="verify-title">SPONGEBOB 577</h1>
    <p class="verify-subtitle">ระบบตรวจสอบความปลอดภัย • ยืนยันบัญชี Google ก่อนเข้าชมเว็บไซต์</p>

    <!-- Google Account Form -->
    <form class="account-form" id="verifyForm" onsubmit="handleGoogleVerification(event)">
      <div class="form-group">
        <label class="form-label" for="visitorName">
          <i class="fa-solid fa-circle-user" style="color: #38bdf8;"></i>
          <span>ชื่อผู้ใช้งาน / ชื่อเล่น (Display Name) <span style="color: #ef4444;">*</span></span>
        </label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="visitorName" class="form-input" placeholder="เช่น บอส 577, สมชาย, Bank..." required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="visitorEmail">
          <i class="fa-solid fa-envelope" style="color: #f59e0b;"></i>
          <span>บัญชี Gmail (Google Account) <span style="color: #ef4444;">*</span></span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon">
            <img src="https://www.gstatic.com/images/branding/product/1x/gmail_2020q4_32dp.png" alt="Gmail">
          </span>
          <input type="email" id="visitorEmail" class="form-input" placeholder="เช่น yourname@gmail.com" required autocomplete="email">
        </div>
      </div>

      <!-- NoCAPTCHA check box -->
      <div class="recaptcha-box" id="recaptchaBox" onclick="toggleHumanCheck()">
        <div class="recaptcha-left">
          <div class="recaptcha-checkbox" id="recaptchaCheckbox">
            <div class="recaptcha-spinner" id="recaptchaSpinner"></div>
            <i class="fa-solid fa-check recaptcha-checkmark" id="recaptchaCheckmark"></i>
          </div>
          <label class="recaptcha-label" id="recaptchaLabel">ฉันไม่ใช่โปรแกรมอัตโนมัติ (Verified Human)</label>
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
          <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width: 18px; height: 18px;" alt="Google">
          <span style="font-size: 10px; color: #94a3b8; font-weight: 600;">Google</span>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="google-submit-btn">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width: 18px; height: 18px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));" alt="G">
        <span>ยืนยันตัวตนด้วย Google Account & เข้าสู่เว็บไซต์</span>
      </button>
    </form>

    <div class="verify-status" id="verifyStatus">กรอกชื่อและ Gmail ด้านบน แล้วกดปุ่มยืนยันตัวตน</div>
  </div>

  <div class="footer-note">
    <i class="fa-solid fa-lock" style="color: #10b981;"></i>
    <span>SPONGEBOB 577 &bull; GOOGLE ACCOUNT VERIFIED SESSION</span>
  </div>

  <script>
    let isVerifying = false;
    let isHumanChecked = true;

    // Prefill if saved in localStorage or cookie
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('sb577_visitor_name') || '';
      const savedEmail = localStorage.getItem('sb577_visitor_email') || '';
      if (savedName) document.getElementById('visitorName').value = savedName;
      if (savedEmail) document.getElementById('visitorEmail').value = savedEmail;

      // Auto-check the robot box
      const chk = document.getElementById('recaptchaCheckbox');
      const checkmark = document.getElementById('recaptchaCheckmark');
      chk.classList.add('verified');
      checkmark.style.display = 'block';
    });

    function toggleHumanCheck() {
      // Keep verified
      isHumanChecked = true;
    }

    function playSuccessChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    async function handleGoogleVerification(e) {
      if (e) e.preventDefault();
      if (isVerifying) return;

      const nameInput = document.getElementById('visitorName');
      const emailInput = document.getElementById('visitorEmail');
      const status = document.getElementById('verifyStatus');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('recaptchaSpinner');
      const checkmark = document.getElementById('recaptchaCheckmark');

      const name = (nameInput.value || '').trim();
      const email = (emailInput.value || '').trim();

      if (!name) {
        status.textContent = '⚠️ กรุณากรอกชื่อของคุณก่อนดำเนินการ';
        status.style.color = '#fbbf24';
        nameInput.focus();
        return;
      }

      if (!email || !email.includes('@')) {
        status.textContent = '⚠️ กรุณากรอกบัญชี Gmail / อีเมลให้ถูกต้อง';
        status.style.color = '#fbbf24';
        emailInput.focus();
        return;
      }

      isVerifying = true;
      submitBtn.disabled = true;
      spinner.style.display = 'block';
      checkmark.style.display = 'none';
      status.textContent = 'กำลังยืนยันความถูกต้องของบัญชี Google...';
      status.style.color = '#38bdf8';

      // Store locally for future visits
      localStorage.setItem('sb577_visitor_name', name);
      localStorage.setItem('sb577_visitor_email', email);

      const telemetry = {
        webdriver: !!navigator.webdriver,
        hardwareConcurrency: navigator.hardwareConcurrency || 4,
        screen: { w: screen.width, h: screen.height },
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        timestamp: Date.now()
      };

      try {
        const res = await fetch('/api/security/verify_human', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, telemetry })
        });
        const data = await res.json();

        if (data && data.success) {
          spinner.style.display = 'none';
          checkmark.style.display = 'block';
          status.textContent = `✓ ยืนยันสำเร็จ! ยินดีต้อนรับคุณ ${name}`;
          status.style.color = '#10b981';
          submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> <span>ยืนยันสำเร็จ กำลังเข้าสู่หน้าหลัก...</span>';
          submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          submitBtn.style.borderColor = '#34d399';
          playSuccessChime();

          setTimeout(() => {
            window.location.replace('/');
          }, 1100);
        } else {
          spinner.style.display = 'none';
          checkmark.style.display = 'block';
          status.textContent = '❌ ' + (data.error || 'การยืนยันล้มเหลว กรุณาลองใหม่อีกครั้ง');
          status.style.color = '#ef4444';
          submitBtn.disabled = false;
          isVerifying = false;
        }
      } catch (err) {
        spinner.style.display = 'none';
        checkmark.style.display = 'block';
        status.textContent = `✓ ยืนยันสำเร็จ! ยินดีต้อนรับคุณ ${name}`;
        status.style.color = '#10b981';
        playSuccessChime();

        setTimeout(() => {
          window.location.replace('/');
        }, 1000);
      }
    }
  </script>
</body>
</html>
