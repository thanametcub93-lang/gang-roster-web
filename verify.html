<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบความปลอดภัย (CAPTCHA) • SPONGEBOB 577</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/gang_logo.png">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 35%, #181a22 0%, #0a0b0e 65%, #000000 100%);
      color: #ffffff;
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
    }

    .verify-card {
      background: rgba(18, 20, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 50px rgba(225, 29, 72, 0.15);
      padding: 42px 36px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(14px);
      animation: cardPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardPop {
      from { opacity: 0; transform: scale(0.92) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .verify-logo-wrap {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 30px rgba(225, 29, 72, 0.28);
    }

    .verify-logo-img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
    }

    .verify-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 5px;
      color: #fff;
      line-height: 1;
      margin-bottom: 6px;
    }

    .verify-subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    /* Google Style NoCAPTCHA Box */
    .recaptcha-box {
      width: 304px;
      height: 78px;
      background: #222222;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-sizing: border-box;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }

    .recaptcha-box:hover {
      border-color: #555555;
      background: #262626;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.8);
    }

    .recaptcha-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recaptcha-checkbox {
      width: 28px;
      height: 28px;
      background: #ffffff;
      border: 2px solid #c1c1c1;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s;
    }

    .recaptcha-checkbox.verified {
      background: #ffffff;
      border-color: #0f9d58;
    }

    .recaptcha-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid #1a73e8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: captchaSpin 0.75s linear infinite;
    }

    @keyframes captchaSpin {
      to { transform: rotate(360deg); }
    }

    .recaptcha-checkmark {
      display: none;
      color: #0f9d58;
      font-size: 20px;
      font-weight: 900;
      animation: checkPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes checkPop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .recaptcha-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Kanit", sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.2;
      cursor: pointer;
    }

    .recaptcha-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.85;
      cursor: default;
    }

    .recaptcha-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .recaptcha-logo-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      color: #9aa0a6;
      font-weight: 600;
    }

    .recaptcha-privacy-text {
      font-size: 8px;
      color: #70757a;
    }

    .verify-status {
      margin-top: 18px;
      font-size: 13px;
      color: #94a3b8;
      min-height: 22px;
      transition: color 0.2s;
    }

    .enter-btn {
      display: none;
      margin-top: 16px;
      width: 100%;
      max-width: 304px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-family: 'Kanit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid #34d399;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4);
      animation: checkPop 0.35s ease forwards;
      transition: all 0.2s ease;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #555555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="verify-card">
    <div class="verify-logo-wrap">
      <img src="/gang_logo.png" alt="SPONGEBOB 577" class="verify-logo-img">
    </div>

    <h1 class="verify-title">SPONGEBOB 577</h1>
    <p class="verify-subtitle">ระบบตรวจสอบความปลอดภัย • ยืนยัน CAPTCHA ก่อนเข้าสู่เว็บไซต์</p>

    <!-- Google Style NoCAPTCHA Box -->
    <div class="recaptcha-box" id="recaptchaBox" onclick="executeCaptchaVerification(event)">
      <div class="recaptcha-left">
        <div class="recaptcha-checkbox" id="recaptchaCheckbox">
          <div class="recaptcha-spinner" id="recaptchaSpinner"></div>
          <i class="fa-solid fa-check recaptcha-checkmark" id="recaptchaCheckmark"></i>
        </div>
        <label class="recaptcha-label" id="recaptchaLabel">ฉันไม่ใช่โปรแกรมอัตโนมัติ (I'm not a robot)</label>
      </div>
      <div class="recaptcha-brand">
        <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA" class="recaptcha-logo" onerror="this.src='/gang_logo.png'">
        <span class="recaptcha-logo-text">reCAPTCHA</span>
        <span class="recaptcha-privacy-text">Privacy - Terms</span>
      </div>
    </div>

    <button id="continueBtn" class="enter-btn" onclick="window.location.replace('/')">เข้าสู่หน้าเว็บหลัก ➜</button>
    <div class="verify-status" id="verifyStatus">คลิกที่ช่องสี่เหลี่ยมด้านบนเพื่อยืนยันตัวตน</div>
  </div>

  <div class="footer-note">SPONGEBOB 577 NEW GEN &bull; OFFICIAL CAPTCHA PROTECTION</div>

  <script>
    let isVerifying = false;

    function playSuccessChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    async function executeCaptchaVerification(e) {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      if (isVerifying) return;
      isVerifying = true;

      const spinner = document.getElementById('recaptchaSpinner');
      const checkmark = document.getElementById('recaptchaCheckmark');
      const chk = document.getElementById('recaptchaCheckbox');
      const label = document.getElementById('recaptchaLabel');
      const status = document.getElementById('verifyStatus');
      const continueBtn = document.getElementById('continueBtn');

      spinner.style.display = 'block';
      checkmark.style.display = 'none';
      status.textContent = 'กำลังตรวจสอบความปลอดภัย (Verifying Browser)...';
      status.style.color = '#38bdf8';

      // 0.8s verification feel
      await new Promise(resolve => setTimeout(resolve, 800));

      const telemetry = {
        webdriver: !!navigator.webdriver,
        hardwareConcurrency: navigator.hardwareConcurrency || 4,
        screen: { w: screen.width, h: screen.height },
        language: navigator.language,
        cookieEnabled: navigator.cookieEnabled,
        timestamp: Date.now()
      };

      try {
        const res = await fetch('/api/security/verify_human', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telemetry })
        });
        const data = await res.json();

        if (data && data.success) {
          spinner.style.display = 'none';
          checkmark.style.display = 'block';
          chk.classList.add('verified');
          label.textContent = 'ฉันไม่ใช่โปรแกรมอัตโนมัติ (ยืนยันแล้ว)';
          status.textContent = '✓ ตรวจสอบสำเร็จ! กำลังเข้าสู่หน้าเว็บ...';
          status.style.color = '#10b981';
          if (continueBtn) continueBtn.style.display = 'block';
          playSuccessChime();

          setTimeout(() => {
            window.location.replace('/');
          }, 900);
        } else {
          spinner.style.display = 'none';
          status.textContent = '❌ ' + (data.error || 'การยืนยันล้มเหลว กรุณาลองใหม่');
          status.style.color = '#ef4444';
          isVerifying = false;
        }
      } catch (err) {
        spinner.style.display = 'none';
        checkmark.style.display = 'block';
        chk.classList.add('verified');
        status.textContent = '✓ ยืนยันสำเร็จ!';
        status.style.color = '#10b981';
        if (continueBtn) continueBtn.style.display = 'block';
        playSuccessChime();

        setTimeout(() => {
          window.location.replace('/');
        }, 800);
      }
    }
  </script>
</body>
</html>
